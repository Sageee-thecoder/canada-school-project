<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanks for Listening</title>
    <style>
        /* Simple, Clean Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9f9f9;
            color: #222222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            line-height: 1.6;
        }

        /* Minimal Content Wrapper */
        .container {
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #111111;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 400;
            color: #666666;
            margin-bottom: 32px;
        }

        h3 {
            font-size: 0.9rem;
            font-weight: 400;
            color: #888888;
            margin-bottom: 20px;
        }

        /* Clean Simple Button */
        #goButton_pg6 {
            display: inline-block;
            font-size: 1rem;
            font-weight: 500;
            color: #111111;
            background-color: #ffffff;
            border: 1px solid #cccccc;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #goButton_pg6:hover {
            background-color: #f0f0f0;
            border-color: #999999;
        }

        #goButton_pg6:active {
            background-color: #e5e5e5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Thanks for listening to me, everybody!</h1>
        <h2>I appreciate it!</h2>
        <h3>Don't forget to take a look at the resources page for the assets used here.</h3>
        
        <button id="goButton_pg6" onclick="window.location.href='resources.md'">
            Resources Page
        </button>
    </div>

</body>
</html>
